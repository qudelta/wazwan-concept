<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI &amp; Technology — NPS × Qudelta (school layout)</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
  :root{
    --navy:#12294A; --ink:#0E1B2E; --green:#00BF63; --green-d:#009B50; --mint:#E4F7ED; --mint-2:#BFEBD4;
    --band:#07241A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1024px;height:1536px}
  body{background:#fff;color:var(--ink);font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
  svg{display:block}
  .poster{position:relative;width:1024px;height:1536px;overflow:hidden;
    background:
      radial-gradient(420px 520px at 1060px 640px,#E6F8EF 0%,rgba(230,248,239,.55) 45%,rgba(255,255,255,0) 75%),
      radial-gradient(500px 360px at 860px 1540px,rgba(228,247,237,.7),rgba(255,255,255,0) 70%),
      #fff}
  .abs{position:absolute}

  /* corner shapes */
  .blob{position:absolute;border-radius:50%;background:linear-gradient(135deg,#86E3B6 0%,#2FCB7E 100%)}
  .ring{position:absolute;border-radius:50%;border:2px solid #9FE4C3}
  .dots{position:absolute;left:936px;top:56px;display:grid;grid-template-columns:repeat(2,10px);column-gap:18px;row-gap:14px}
  .dots i{width:10px;height:10px;border-radius:50%;background:#5CCB98}

  /* school */
  .crest{left:382px;top:48px;width:260px;height:260px;filter:drop-shadow(0 6px 14px rgba(10,40,70,.12))}
  .sname{left:0;right:0;top:326px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:68px;line-height:1;color:var(--navy);letter-spacing:.002em}
  .splace{left:0;right:0;top:400px;text-align:center;font-weight:600;font-size:29px;letter-spacing:.33em;padding-left:.33em;color:var(--navy)}
  .rule{left:455px;top:457px;width:120px;height:5px;border-radius:3px;background:var(--green)}

  /* title */
  .kicker{left:55px;top:505px;font-weight:400;font-size:27px;letter-spacing:.21em;color:#1C2A3D}
  .ai{left:44px;top:528px;font-weight:900;font-size:206px;line-height:1;letter-spacing:-.02em;white-space:nowrap}
  .ai .g{background:linear-gradient(180deg,#1ECB74 0%,#00A957 60%,#008C47 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .ai .amp{color:var(--ink);font-size:176px;margin-left:14px}
  .tech{left:51px;top:722px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:122px;line-height:1;letter-spacing:-.005em;color:var(--ink)}
  .uline{left:55px;top:842px;width:106px;height:6px;border-radius:3px;background:var(--green)}

  /* Q tile */
  .glow{left:560px;top:430px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(0,191,99,.46) 0%,rgba(0,191,99,.20) 36%,rgba(0,191,99,.06) 55%,rgba(0,191,99,0) 70%)}
  .orbits{left:560px;top:430px;width:520px;height:520px}
  .tile{left:706px;top:580px;width:222px;height:222px;border-radius:40px;display:grid;place-items:center;
    background:linear-gradient(150deg,#1F2B25 0%,#0B120E 45%,#050806 100%);
    border:1px solid rgba(255,255,255,.10);
    box-shadow:0 26px 50px rgba(0,70,35,.32),0 0 60px rgba(0,191,99,.35),inset 0 1px 0 rgba(255,255,255,.14),inset 0 -12px 30px rgba(0,0,0,.4)}
  .tile img{width:134px;height:auto}

  /* audience pill */
  .pill{left:50px;top:872px;width:628px;height:64px;border-radius:18px;background:var(--mint);display:flex;align-items:center;gap:22px;padding-left:22px}
  .pill svg{width:42px;height:42px;color:var(--ink);stroke-width:2.5}
  .pill p{font-weight:500;font-size:29px;letter-spacing:.11em;color:#1C2A3D;white-space:nowrap}
  .pill b{font-weight:700;color:var(--green-d)}

  /* features */
  .feat{top:962px;width:300px;text-align:center}
  .feat .c{width:108px;height:108px;margin:0 auto;border-radius:50%;background:var(--mint);display:grid;place-items:center}
  .feat .c svg{width:58px;height:58px;color:var(--ink);stroke-width:2.4}
  .feat h3{margin-top:10px;font-weight:600;font-size:28px;line-height:1.04;color:var(--navy)}
  .vr{top:968px;width:1.5px;height:162px;background:#CFD9E0}

  /* session by */
  .band{left:40px;top:1164px;width:944px;height:164px;border-radius:14px;background:linear-gradient(90deg,#082A1D 0%,#062016 100%);box-shadow:0 14px 34px rgba(4,40,24,.22)}
  .band small{position:absolute;left:40px;top:70px;font-weight:500;font-size:23px;letter-spacing:.26em;color:#DDEBE3}
  .band .v{position:absolute;left:246px;top:42px;width:2px;height:80px;background:var(--green)}
  .band img{position:absolute;left:326px;top:46px;height:72px;width:auto}

  /* date / venue */
  .ico{color:var(--navy);stroke-width:2.2}
  .lbl{font-weight:700;font-size:21px;letter-spacing:.02em;color:var(--navy)}
  .date{left:163px;top:1394px;font-weight:700;font-size:40px;line-height:1;color:var(--navy)}
  .date sup{font-size:22px;vertical-align:17px;margin-left:1px}
  .venue{left:625px;top:1395px;font-weight:400;font-size:26px;line-height:1.16;color:var(--navy)}
  .hr{left:481px;top:1364px;width:1.5px;height:90px;background:#CFD9E0}
</style>
</head>
<body>
<div class="poster">
  <!-- corner decoration -->
  <div class="blob" style="left:-140px;top:-140px;width:270px;height:270px"></div>
  <div class="ring" style="left:-185px;top:-185px;width:355px;height:355px"></div>
  <div class="dots">
    <i style="opacity:.35"></i><i style="opacity:.35"></i><i style="opacity:.5"></i><i style="opacity:.5"></i>
    <i style="opacity:.62"></i><i style="opacity:.62"></i><i style="opacity:.75"></i><i style="opacity:.75"></i>
    <i style="opacity:.85"></i><i style="opacity:.85"></i><i style="opacity:.95"></i><i style="opacity:.95"></i>
    <i></i><i></i>
  </div>
  <div class="blob" style="left:-60px;top:1440px;width:170px;height:170px;opacity:.85"></div>
  <div class="blob" style="left:915px;top:1440px;width:180px;height:180px"></div>
  <div class="ring" style="left:870px;top:1395px;width:270px;height:270px"></div>

  <!-- school -->
  <img class="abs crest" src="assets/nps-crest.png" alt="National Public School crest">
  <div class="abs sname">NATIONAL PUBLIC SCHOOL</div>
  <div class="abs splace">LANGATE HANDWARA</div>
  <div class="abs rule"></div>

  <!-- Q tile with orbits -->
  <div class="abs glow"></div>
  <svg class="abs orbits" viewBox="0 0 520 520" fill="none">
    <g transform="rotate(-28 258 262)">
      <ellipse cx="258" cy="262" rx="205" ry="128" stroke="#00BF63" stroke-width="1.6" opacity=".7"/>
      <circle cx="53" cy="262" r="9" fill="#00BF63"/>
      <circle cx="400" cy="170" r="9" fill="#00BF63"/>
    </g>
    <g transform="rotate(62 258 262)">
      <ellipse cx="258" cy="262" rx="212" ry="112" stroke="#00BF63" stroke-width="1.6" opacity=".55"/>
      <circle cx="96" cy="334" r="9" fill="#00BF63"/>
      <circle cx="420" cy="192" r="9" fill="#00BF63"/>
    </g>
  </svg>
  <div class="abs tile"><img src="assets/qudelta-mark.png" alt="Qudelta Studios"></div>

  <!-- title -->
  <div class="abs kicker">INTERACTIVE SESSION ON</div>
  <div class="abs ai"><span class="g">AI</span><span class="amp">&amp;</span></div>
  <div class="abs tech">TECHNOLOGY</div>
  <div class="abs uline"></div>

  <div class="abs pill"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M18 21a8 8 0 0 0-16 0" /> <circle cx="10" cy="8" r="5" /> <path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3" /> </svg><p>FOR <b>TEACHERS</b> AND <b>STUDENTS</b></p></div>

  <div class="abs feat" style="left:32px"><div class="c"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M18 5a2 2 0 0 1 2 2v8.526a2 2 0 0 0 .212.897l1.068 2.127a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45l1.068-2.127A2 2 0 0 0 4 15.526V7a2 2 0 0 1 2-2z" /> <path d="M20.054 15.987H3.946" /> </svg></div><h3>Live<br>Demonstrations</h3></div>
  <div class="abs vr" style="left:346px"></div>
  <div class="abs feat" style="left:361px"><div class="c"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M18 21a8 8 0 0 0-16 0" /> <circle cx="10" cy="8" r="5" /> <path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3" /> </svg></div><h3>Interactive<br>Discussion</h3></div>
  <div class="abs vr" style="left:678px"></div>
  <div class="abs feat" style="left:688px"><div class="c"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5" /> <path d="M9 18h6" /> <path d="M10 22h4" /> </svg></div><h3>Future<br>Opportunities</h3></div>

  <div class="abs band"><small>SESSION BY</small><span class="v"></span><img src="assets/qudelta-logo-light.png" alt="Qudelta Studios"></div>

  <svg class="abs ico" style="left:72px;top:1368px;width:60px;height:60px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v3" /> <path d="M16 2v3" /> <rect x="3" y="3" width="18" height="18" rx="2" /> <path d="M3 9h18" /> <path d="M8 13h.01" /> <path d="M12 13h.01" /> <path d="M16 13h.01" /> <path d="M8 17h.01" /> <path d="M12 17h.01" /> <path d="M16 17h.01" /></svg>
  <div class="abs lbl" style="left:163px;top:1366px">DATE</div>
  <div class="abs date">30<sup>th</sup> Sept 2026</div>
  <div class="abs hr"></div>
  <svg class="abs" style="left:536px;top:1366px;width:52px;height:64px" viewBox="0 0 24 30"><path d="M12 1C6.2 1 1.5 5.6 1.5 11.3 1.5 18.6 12 29 12 29s10.5-10.4 10.5-17.7C22.5 5.6 17.8 1 12 1z" fill="#12294A"/><circle cx="12" cy="11.2" r="4.2" fill="#fff"/></svg>
  <div class="abs lbl" style="left:625px;top:1366px">VENUE</div>
  <div class="abs venue">National Public School<br>Langate Handwara</div>
</div>
</body>
</html>
